<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>English Study Planner — A2+ to B1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <div class="login-logo">📖</div>
            <div class="login-title">Study Planner</div>
            <div class="login-sub">A2+ to B1 &nbsp;·&nbsp; 3 months</div>
            <button class="login-btn" id="googleLoginBtn">Continue with Google</button>
            <div class="login-note">Seu progresso é salvo automaticamente.</div>
        </div>
    </div>

    <div id="planner" style="display: none;">
        <div class="topbar">
            <div class="topbar-name"><span>Studying as &nbsp;</span><span id="topbarName"></span></div>
            <button class="topbar-logout" id="logoutBtn">Sair</button>
        </div>
        <div class="page" id="main-content">
            <!-- O conteúdo será preenchido pelo JS -->
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
